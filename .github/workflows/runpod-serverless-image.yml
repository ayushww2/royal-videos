name: Build RunPod Serverless Remotion image

on:
  workflow_dispatch:
  push:
    paths:
      - "Dockerfile.serverless"
      - "serverless/**"
      - "scripts/runpod-serverless-render.ts"
      - "server/render/remotionRender.ts"
      - "remotion/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.serverless
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/new-video-ai-remotion-serverless:latest
            ghcr.io/${{ github.repository_owner }}/new-video-ai-remotion-serverless:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public (best-effort)
        continue-on-error: true
        run: |
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/new-video-ai-remotion-serverless/visibility" \
            -f visibility=public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
