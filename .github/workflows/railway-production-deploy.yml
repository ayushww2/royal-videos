# Deploy Dockerfile service to Railway when main updates (requires repo secrets).
# Railway dashboard: Project → Service → Settings → copy Service ID.
# Account token: https://railway.com/account/tokens → RAILWAY_TOKEN
name: Deploy production (Railway)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway redeploy
        if: ${{ secrets.RAILWAY_TOKEN != '' && secrets.RAILWAY_SERVICE_ID != '' }}
        run: |
          set -euo pipefail
          query='mutation s($id:String!){serviceInstanceRedeploy(serviceId:$id)}'
          payload=$(jq -nc --arg q "$query" --arg id "${{ secrets.RAILWAY_SERVICE_ID }}" \
            '{query:$q,variables:{id:$id}}')
          curl -sfS -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$payload"
          echo "Railway redeploy requested."

      - name: Secrets missing (skip)
        if: ${{ secrets.RAILWAY_TOKEN == '' || secrets.RAILWAY_SERVICE_ID == '' }}
        run: |
          echo "::warning::Set GitHub secrets RAILWAY_TOKEN and RAILWAY_SERVICE_ID to enable auto-deploy."
          echo "Or redeploy manually: Railway → royal-videos-production → Deploy → Redeploy."
