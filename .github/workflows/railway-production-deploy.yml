# Optional: auto-redeploy Railway when main changes.
# Add GitHub repo secrets: RAILWAY_TOKEN, RAILWAY_SERVICE_ID
name: Deploy production (Railway)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: railway-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Railway redeploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ] || [ -z "${RAILWAY_SERVICE_ID:-}" ]; then
            echo "::warning::Missing RAILWAY_TOKEN or RAILWAY_SERVICE_ID — skip API redeploy."
            echo "Redeploy manually: Railway → royal-videos-production → Deployments → Redeploy."
            exit 0
          fi
          query='mutation s($id:String!){serviceInstanceRedeploy(serviceId:$id)}'
          payload=$(jq -nc --arg q "$query" --arg id "$RAILWAY_SERVICE_ID" \
            '{query:$q,variables:{id:$id}}')
          curl -sfS -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload"
          echo "Railway redeploy requested."
